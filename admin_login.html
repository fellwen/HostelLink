<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="assets/styles/admin_login.css">
  <title>Вход в админ-панель</title>
</head>
<body>

  <div class="login-card">
    <h2>🔐 Вход для администратора</h2>
    <form id="loginForm">
      <div class="form-group">
        <label>Логин</label>
        <input type="text" id="login" placeholder="admin" required>
      </div>
      <div class="form-group">
        <label>Пароль</label>
        <input type="password" id="password" placeholder="••••••" required>
      </div>
      <button type="submit" class="btn-login">Войти</button>
      <div class="error-msg" id="errorMsg">Неверный логин или пароль!</div>
    </form>
    <a href="index.html" class="back-link">← Вернуться на сайт</a>
  </div>

  <script src="assets/script/admin_login.js">
  
  </script>
</body>
</html>
