<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="assets/styles/admin.css">
  <title>Admin — HosteLink</title>
</head>
<body>

  <header class="header">
    <h3>🛡️ Панель администратора</h3>
    <div>
      <a href="index.html">Вернуться на сайт</a>
      <button class="btn-logout" onclick="logout()">Выйти</button>
    </div>
  </header>

  <div class="container">
    <div class="stats">
      <div class="stat-card">
        <div class="stat-num" id="countAll">0</div>
        <div>Всего заявок</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="countPending" style="color: orange;">0</div>
        <div>Ожидают</div>
      </div>
    </div>

    <table id="bookingsTable">
      <thead>
        <tr>
          <th>ID</th>
          <th>Номер</th>
          <th>Гость</th>
          <th>Контакты</th>
          <th>Даты</th>
          <th>Статус</th>
          <th>Действия</th>
        </tr>
      </thead>
      <tbody>
      </tbody>
    </table>
  </div>

  <script src="assets/script/admin.js">
 
  </script>
</body>
</html>
